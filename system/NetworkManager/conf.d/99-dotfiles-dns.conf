[main]
dns=systemd-resolved
systemd-resolved=true

[connection]
# LAN resolvers handed out by DHCP (a FRITZ!Box, say) don't speak DNS-over-TLS.
# Under the global DNSOverTLS=yes every lookup in the LAN's own domain then fails
# after a timeout. Only that domain goes to them; ~. still goes to Cloudflare.
connection.dns-over-tls=0
