k9s:
  liveViewAutoRefresh: false
  screenDumpDir: /tmp/k9s-screen-dumps
  refreshRate: 2
  maxConnRetry: 5
  # Fail safe: read-only by default so prod/remote contexts cannot be mutated by
  # accident. Toggle write mode per session with `w` (or launch `k9s --write`)
  # on the local dev cluster.
  readOnly: true
  noExitOnCtrlC: false
  ui:
    enableMouse: true
    headless: false
    logoless: false
    crumbsless: false
    reactive: false
    noIcons: false
    defaultsToFullScreen: false
  skipLatestRevCheck: false
  disablePodCounting: false
  shellPod:
    image: busybox:1.35.0
    namespace: default
    limits:
      cpu: 100m
      memory: 100Mi
  imageScans:
    enable: false
    exclusions:
      namespaces: []
      labels: {}
  logger:
    tail: 100
    buffer: 5000
    sinceSeconds: -1
    textWrap: true
    showTime: true
  thresholds:
    cpu:
      critical: 90
      warn: 70
    memory:
      critical: 90
      warn: 70
