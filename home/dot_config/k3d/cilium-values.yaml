# Cilium Helm values for the local k3d "dev" cluster. Plain chart values (no
# HelmRelease wrapper) so a later Flux HelmRelease can consume this file
# unchanged via its own values/valuesFrom.
#
# kube-proxy is disabled on the cluster, so Cilium replaces it and must be told
# the API server address directly. On k3d that is the server load balancer.
kubeProxyReplacement: true
k8sServiceHost: k3d-dev-serverlb
k8sServicePort: 6443

# k3d nodes are separate Docker containers, not L2-adjacent, so use tunnelling.
routingMode: tunnel
tunnelProtocol: vxlan

# LB-IPAM + L2 announcements give type: LoadBalancer services real IPs locally.
l2announcements:
  enabled: true

gatewayAPI:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

# Unaggregated monitor events for tracing/BPF study.
bpf:
  monitorAggregation: none

operator:
  replicas: 1
