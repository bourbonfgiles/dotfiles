apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: dev
# One server keeps the control plane "invisible" like EKS; the three agents are
# the only nodes workloads see. --cluster-init still gives this server etcd
# (not SQLite), matching the datastore EKS runs.
servers: 1
agents: 3
# A Kubernetes minor that EKS also offers (not EKS's own distribution). Match
# the minor to your target EKS with `aws eks describe-cluster`; bump freely.
image: rancher/k3s:v1.36.4-k3s1
kubeAPI:
  hostIP: "127.0.0.1"
# Pre-created by k8s.py with a fixed subnet and bridge name; k3d leaves it in
# place on cluster delete.
network: k3d-dev
# Persistent standalone registry (created by k8s.py, survives cluster deletes so
# the image cache is kept). k3d prepends "k3d-" to the name below, so the
# node-resolvable host is k3d-registry.localhost:5000, matching the mirror.
registries:
  use:
    - k3d-registry.localhost:5000
  config: |
    mirrors:
      "k3d-registry.localhost:5000":
        endpoint:
          - http://k3d-registry.localhost:5000
ports:
  - port: 25565:30000
    nodeFilters:
      - loadbalancer
  - port: 30001:30001
    nodeFilters:
      - loadbalancer
  - port: 30002:30002
    nodeFilters:
      - loadbalancer
  - port: 30003:30003
    nodeFilters:
      - loadbalancer
  - port: 30004:30004
    nodeFilters:
      - loadbalancer
# No bpffs volume: Cilium auto-mounts /sys/fs/bpf inside each agent, and eBPF
# objects are kernel-global so host bpftool sees them regardless. A single
# host bpffs shared across all node containers would collide pinned maps.
# Pods inherit kubelet's resolv.conf. The node's own copy carries the host's LAN
# search domains, so every external lookup first tried e.g. "<name>.fritz.box"
# and could stall for seconds. This one points at Podman's DNS with no search.
files:
  - description: Pod DNS without LAN search domains
    source: |
      nameserver 10.89.0.1
    destination: /etc/rancher/k3s/resolv.conf
    nodeFilters:
      - server:*
      - agent:*
options:
  k3d:
    disableLoadbalancer: false
  k3s:
    extraArgs:
      - arg: --cluster-init
        nodeFilters:
          - server:0
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
      - arg: --flannel-backend=none
        nodeFilters:
          - server:*
      - arg: --disable-network-policy
        nodeFilters:
          - server:*
      - arg: --disable-kube-proxy
        nodeFilters:
          - server:*
      - arg: --resolv-conf=/etc/rancher/k3s/resolv.conf
        nodeFilters:
          - server:*
          - agent:*
      - arg: --node-taint=node-role.kubernetes.io/control-plane:NoSchedule
        nodeFilters:
          - server:*
      - arg: --node-label=topology.kubernetes.io/region=eu-west-2
        nodeFilters:
          - agent:*
      - arg: --node-label=node.kubernetes.io/instance-type=m5.large
        nodeFilters:
          - agent:*
      - arg: --node-label=eks.amazonaws.com/nodegroup=general
        nodeFilters:
          - agent:*
      - arg: --node-label=eks.amazonaws.com/capacityType=ON_DEMAND
        nodeFilters:
          - agent:*
      - arg: --node-label=topology.kubernetes.io/zone=eu-west-2a
        nodeFilters:
          - agent:0
      - arg: --node-label=topology.kubernetes.io/zone=eu-west-2b
        nodeFilters:
          - agent:1
      - arg: --node-label=topology.kubernetes.io/zone=eu-west-2c
        nodeFilters:
          - agent:2
