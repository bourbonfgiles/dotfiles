apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: dev
servers: 3
agents: 3
image: rancher/k3s:v1.36.4-k3s1
registries:
  config: |
    mirrors:
      "k3d-registry.localhost:5000":
        endpoint:
          - http://k3d-registry.localhost:5000
ports:
  - port: 25565:25565
    nodeFilters:
      - loadbalancer
  - port: 30000:30000
    nodeFilters:
      - loadbalancer
  - port: 30001:30001
    nodeFilters:
      - loadbalancer
  - port: 30002:30002
    nodeFilters:
      - loadbalancer
  - port: 30003:30003
    nodeFilters:
      - loadbalancer
  - port: 30004:30004
    nodeFilters:
      - loadbalancer
options:
  k3d:
    disableLoadbalancer: false
  k3s:
    extraArgs:
      - arg: --cluster-init
        nodeFilters:
          - server:0
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      - arg: --disable=servicelb
        nodeFilters:
          - server:*
      - arg: --flannel-backend=none
        nodeFilters:
          - server:*
      - arg: --disable-network-policy
        nodeFilters:
          - server:*
      - arg: --disable-kube-proxy
        nodeFilters:
          - server:*
      - arg: --node-taint=node-role.kubernetes.io/control-plane:NoSchedule
        nodeFilters:
          - server:*
      - arg: --node-label=topology.kubernetes.io/zone=local-a
        nodeFilters:
          - agent:0
      - arg: --node-label=node.kubernetes.io/instance-type=local.large
        nodeFilters:
          - agent:0
      - arg: --node-label=topology.kubernetes.io/zone=local-b
        nodeFilters:
          - agent:1
      - arg: --node-label=node.kubernetes.io/instance-type=local.large
        nodeFilters:
          - agent:1
      - arg: --node-label=topology.kubernetes.io/zone=local-c
        nodeFilters:
          - agent:2
      - arg: --node-label=node.kubernetes.io/instance-type=local.large
        nodeFilters:
          - agent:2
